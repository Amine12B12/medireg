name: Tests

# À chaque push et pull request : build de production, puis tests de bout en bout.
# Supabase est simulé dans les tests (e2e/faux-supabase.ts) : aucune donnée réelle n'est lue ni écrite.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valeurs factices : les tests interceptent toutes les requêtes vers Supabase
      NEXT_PUBLIC_SUPABASE_URL: https://bhqsaajduogwebaovxsd.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-anon-factice-ci
      SUPABASE_SERVICE_ROLE_KEY: cle-service-factice-ci
      MEDITRACK_SERVICE_ROLE_KEY: cle-meditrack-factice-ci
      NEXT_PUBLIC_APP_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build de production
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultats-playwright
          path: test-results
          retention-days: 14
